services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
      POSTGRES_DB: aura
    ports:
      - "127.0.0.1:${AURA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura"]
      interval: 5s
      timeout: 5s
      retries: 5

  aura-app:
    image: aura-app:ci
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: aura-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://aura:aura@postgres:5432/aura
      AURA_WORKSPACE_ROOT: /app/workspace
      CHECKPOINT_DB_PATH: /app/checkpoints/aura_checkpoints.db
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME:-gpt-4o-mini}
      MODEL_TEMPERATURE: ${MODEL_TEMPERATURE:-0.0}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-2048}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-text-embedding-3-small}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      RESEARCH_PROVIDER_MODE: ${RESEARCH_PROVIDER_MODE:-deterministic}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LOG_LEVEL: INFO
    command:
      - sh
      - -c
      - python -m alembic upgrade head && exec uvicorn app.api.server:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:${AURA_API_PORT:-8000}:8000"
    volumes:
      - workspace_data:/app/workspace
      - checkpoint_data:/app/checkpoints
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  workspace_data:
  checkpoint_data:
