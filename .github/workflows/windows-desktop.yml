name: Windows Desktop

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7

      - name: Parse read-only Windows snapshot script
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $scriptPath = (Resolve-Path 'desktop/scripts/Get-AuraDesktopSnapshot.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            throw 'The read-only Windows snapshot script has PowerShell parse errors.'
          }

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked Python runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv pip install --system -r requirements-dev.lock
          uv pip install --system -e .
          python -m pip install -r desktop/requirements-sidecar.txt

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Run desktop UI tests and build
        shell: pwsh
        run: |
          npm test --prefix web -- --reporter=dot --maxWorkers=2
          npm run desktop:build --prefix web

      - name: Run desktop API and backup regressions
        env:
          DESKTOP_MODE: "true"
          LANGGRAPH_STRICT_MSGPACK: "true"
        run: python -m pytest -q tests/api/test_desktop_runtime.py tests/desktop/test_backup_archive.py tests/desktop/test_tauri_config.py

      - name: Generate Windows app icon
        run: python desktop/scripts/make_icon.py

      - name: Build frozen AURA API sidecar
        shell: pwsh
        run: ./desktop/scripts/build_sidecar.ps1

      - name: Smoke test packaged Python runtime
        env:
          DESKTOP_MODE: "true"
          LANGGRAPH_STRICT_MSGPACK: "true"
        run: ./desktop/src-tauri/binaries/aura-api.exe --desktop-self-test

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check

      - name: Test desktop native path validation
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build per-user NSIS installer
        working-directory: desktop/src-tauri
        run: ..\..\web\node_modules\.bin\tauri.cmd build --bundles nsis

      - name: Write installer checksum
        shell: pwsh
        run: |
          $Installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $Installer) { throw 'Tauri did not produce the NSIS installer.' }
          $Hash = Get-FileHash -LiteralPath $Installer.FullName -Algorithm SHA256
          "$($Hash.Hash)  $($Installer.Name)" | Set-Content -Encoding ascii "$($Installer.FullName).sha256"

      - name: Upload unsigned installer for review and dogfood
        uses: actions/upload-artifact@v6
        with:
          name: aura-desktop-windows-x64-${{ github.sha }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
          retention-days: 30
