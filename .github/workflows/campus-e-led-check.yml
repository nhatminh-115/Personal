name: Campus E LED integration checks

on:
  push:
    branches:
      - feature/campus-e-led-sync
    paths:
      - 'Campus-E-Wayfinding/**'
      - '.github/workflows/campus-e-led-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Campus-E-Wayfinding
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Campus-E-Wayfinding/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm pages:build

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "Adafruit NeoPixel" "PubSubClient"
          mkdir -p /tmp/CampusELedController
          cp Campus-E-Wayfinding/esp32/CampusELedController.ino /tmp/CampusELedController/CampusELedController.ino
          arduino-cli compile --fqbn esp32:esp32:esp32 /tmp/CampusELedController
