name: Campus E LED - frontend and firmware checks

on:
  push:
    branches:
      - feature/campus-e-led-sync
    paths:
      - 'Campus-E-Wayfinding/**'
      - '.github/workflows/campus-e-led-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Campus-E-Wayfinding
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Campus-E-Wayfinding/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm pages:build
      - uses: actions/upload-artifact@v4
        with:
          name: campus-e-led-pages-preview
          path: Campus-E-Wayfinding/pages-dist/
          if-no-files-found: error
          retention-days: 7
      - name: Export build to dedicated staging branch
        shell: bash
        run: |
          set -euo pipefail
          cd Campus-E-Wayfinding/pages-dist
          touch .nojekyll
          git init
          git config user.name "campus-e-build-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B campus-e-led-export
          git add -A
          git commit -m "Build Campus E Wayfinding with LED controls"
          git remote add publish "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force publish HEAD:refs/heads/campus-e-led-export

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "Adafruit NeoPixel" "PubSubClient"
      - name: Compile with placeholder test credentials, no secrets
        run: |
          mkdir -p /tmp/BuildingSpotlight_SparseAmbient
          cp Campus-E-Wayfinding/firmware/BuildingSpotlight_SparseAmbient.ino /tmp/BuildingSpotlight_SparseAmbient/
          cp Campus-E-Wayfinding/firmware/led_mqtt_addon.h /tmp/BuildingSpotlight_SparseAmbient/
          cp Campus-E-Wayfinding/firmware/led_mqtt_ca.h /tmp/BuildingSpotlight_SparseAmbient/
          cp Campus-E-Wayfinding/firmware/led_power_plan.h /tmp/BuildingSpotlight_SparseAmbient/
          cp Campus-E-Wayfinding/firmware/led_private.h.example /tmp/BuildingSpotlight_SparseAmbient/led_private.h
          arduino-cli compile --fqbn esp32:esp32:esp32 /tmp/BuildingSpotlight_SparseAmbient
