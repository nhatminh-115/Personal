name: Deploy Campus E LED Control (tablet)
on:
  push:
    branches:
      - feature/campus-e-led-sync
    paths:
      - 'Campus-E-Wayfinding/**'
      - '.github/workflows/campus-e-led-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: campus-e-led-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Campus-E-Wayfinding/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: Campus-E-Wayfinding
        run: pnpm install --frozen-lockfile
      - name: Build tablet website
        working-directory: Campus-E-Wayfinding
        run: pnpm pages:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Campus-E-Wayfinding/pages-dist
      - id: deployment
        uses: actions/deploy-pages@v4
