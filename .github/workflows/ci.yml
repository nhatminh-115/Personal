name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aura_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_TEST_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/aura_test"
      AURA_POSTGRES_TEST_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/aura_test"
      LANGGRAPH_STRICT_MSGPACK: "true"
      PYTHONPATH: "."

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies from lockfile
        run: |
          uv pip install --system -r requirements-dev.lock
          uv pip install --system -e .

      - name: Pre-pull Docker image for sandbox
        run: |
          docker pull python:3.12-slim

      - name: Wait for PostgreSQL socket ready
        run: |
          python -c "
          import socket, time
          for attempt in range(30):
              try:
                  s = socket.socket()
                  s.connect(('127.0.0.1', 5432))
                  s.close()
                  print('PostgreSQL is listening on 127.0.0.1:5432')
                  break
              except Exception as e:
                  print(f'Waiting for Postgres ({attempt+1}/30)...')
                  time.sleep(1)
          "

      - name: Run Alembic migration upgrade to head
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/aura_test"
        run: |
          python -m alembic upgrade head

      - name: Run test suite with strict msgpack
        run: |
          python -m pytest -v

      - name: Run live Phase 1 verification
        run: |
          python scripts/verify_live.py

      - name: Run live Phase 2.1 verification
        run: |
          python scripts/verify_phase2.py
