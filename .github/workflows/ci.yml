name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aura_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_TEST_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/aura_test"
      AURA_POSTGRES_TEST_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/aura_test"
      LANGGRAPH_STRICT_MSGPACK: "true"
      PYTHONPATH: "."

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies from lockfile
        run: |
          uv pip install --system -r requirements-dev.lock
          uv pip install --system -e .

      - name: Build coding sandbox Docker image with pytest
        run: |
          docker build -t aura-coding-sandbox:latest -f docker/coding_sandbox.Dockerfile .

      - name: Build AURA API Docker image
        run: docker build -t aura-app:ci -f docker/Dockerfile .

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Start AURA Compose stack and verify readiness
        run: |
          set -euo pipefail
          export COMPOSE_PROJECT_NAME=aura-ci
          export AURA_POSTGRES_PORT=15432
          export AURA_API_PORT=18000
          cleanup() {
            docker compose logs --no-color aura-app || true
            docker compose down --volumes --remove-orphans
          }
          trap cleanup EXIT
          docker compose up -d --no-build
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:${AURA_API_PORT}/ready > readiness.json
          python -c "import json, pathlib; data=json.loads(pathlib.Path('readiness.json').read_text()); assert data == {'status': 'ready', 'checks': {'database': 'healthy', 'checkpointer': 'healthy'}}, data; print(data)"

          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"session_id":"aura-compose-restart-smoke","message":"Write persistent test to aura-compose-smoke.txt"}' \
            http://127.0.0.1:${AURA_API_PORT}/v1/chat > chat-before-restart.json
          python -c "import json, pathlib; data=json.loads(pathlib.Path('chat-before-restart.json').read_text()); assert data['status'] == 'waiting_for_approval', data; assert data.get('approval_id') and data.get('run_id'), data; print({'run_id': data['run_id'], 'status': data['status']})"
          approval_id=$(python -c "import json, pathlib; print(json.loads(pathlib.Path('chat-before-restart.json').read_text())['approval_id'])")
          docker compose exec -T aura-app test ! -e /app/workspace/aura-compose-smoke.txt

          docker compose restart aura-app
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:${AURA_API_PORT}/ready > readiness-after-restart.json
          python -c "import json, pathlib; data=json.loads(pathlib.Path('readiness-after-restart.json').read_text()); assert data == {'status': 'ready', 'checks': {'database': 'healthy', 'checkpointer': 'healthy'}}, data; print(data)"

          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"decision":"approved","decision_notes":"Compose restart durability smoke"}' \
            "http://127.0.0.1:${AURA_API_PORT}/v1/approvals/${approval_id}/decision" > approval-after-restart.json
          python -c "import json, pathlib; data=json.loads(pathlib.Path('approval-after-restart.json').read_text()); assert data['status'] == 'approved', data; assert data['execution_status'] == 'completed', data; print({'run_id': data['run_id'], 'execution_status': data['execution_status']})"
          docker compose exec -T aura-app sh -c 'test "$(cat /app/workspace/aura-compose-smoke.txt)" = "persistent test"'

      - name: Wait for PostgreSQL asyncpg connection
        run: |
          python -c "
          import asyncio, asyncpg, time
          async def check():
              for attempt in range(30):
                  try:
                      conn = await asyncpg.connect('postgresql://postgres:postgres@127.0.0.1:5432/aura_test')
                      val = await conn.fetchval('SELECT 1')
                      await conn.close()
                      print(f'PostgreSQL asyncpg connection established successfully (SELECT 1 -> {val})')
                      return
                  except Exception as e:
                      print(f'Waiting for Postgres asyncpg ({attempt+1}/30): {e}')
                      await asyncio.sleep(1)
              raise RuntimeError('PostgreSQL failed to accept connections within 30s')
          asyncio.run(check())
          "

      - name: Run Alembic migration upgrade to head
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/aura_test"
        run: |
          set -e
          python -m alembic --raiseerr upgrade head

      - name: Run test suite with strict msgpack
        run: |
          python -m pytest -v --tb=short

      - name: Run live Phase 1 verification
        run: |
          python scripts/verify_live.py

      - name: Run live Phase 2.1 verification
        run: |
          python scripts/verify_phase2.py

      - name: Run live Phase 3 verification
        run: |
          python scripts/verify_phase3.py

      - name: Run live Phase 4 verification
        run: |
          python scripts/verify_phase4.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Run frontend tests and build
        run: |
          cd web
          npm ci
          npm test
          npm run build
